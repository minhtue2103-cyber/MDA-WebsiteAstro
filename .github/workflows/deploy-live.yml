name: Deploy Production to Hostinger
on:
  push:
    branches:
      - live-server
  workflow_dispatch: # Cho phép bấm chạy lại thủ công khi cần
concurrency:
  group: deploy-live-server
  cancel-in-progress: false # Đợi job trước chạy xong rồi mới chạy job sau
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm install
      - name: Build Astro Project
        run: npm run build
      - name: Deploy to Hostinger via lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp "$FTP_SERVER" <<EOF
          set ftp:ssl-allow no
          set net:max-retries 10
          set net:reconnect-interval-base 5
          set net:timeout 60
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          mirror -R --delete --parallel=1 --exclude-glob .htaccess --exclude-glob .well-known/** --verbose ./dist/ ./
          quit
          EOF
